<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widht=device-width, initial-scale=1.0">
    <title>Poste Finance Analyzer</title>
    <!-- Importazione Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Dashboard Finanziaria</h1>

        <!-- Upload File & Reset -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
                <input class="form-control" type="file" id="file-excel" accept=".xlsx">
                <button class="btn btn-dark text-nowrap" type="button" id="btn-importa" onclick="importaExcel()">Importa
                    Excel</button>
                <button class="btn btn-danger text-nowrap" type="button" id="btn-reset" onclick="reset()">Reset</button>
            </div>
        </div>

        <div class="row">
            <!-- Card Entrate -->
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3 shadow">
                    <div class="card-header"> Totale Entrate</div>
                    <div class="card-body">
                        <!-- Questo <h3> ha un 'id' che useremo in JavaScript per trovare l'elemento -->
                        <h3 class="card-title" id="val-entrate">€ 0.00</h3>
                    </div>
                </div>
            </div>

            <!-- Card Uscite -->
            <div class="col-md-4">
                <div class="card text-white bg-danger mb-3 shadow">
                    <div class="card-header">Totale Uscite</div>
                    <div class="card-body">
                        <h3 class="card-title" id="val-uscite">€ 0.00</h3>
                    </div>
                </div>
            </div>

            <!-- Card Saldo -->
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3 shadow">
                    <div class="card-header">Saldo Netto</div>
                    <div class="card-body">
                        <h3 class="card-title" id="val-saldo">€ 0.00</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- INIZIO JAVASCRIPT -->
    <script>
        async function reset() {
            try {
                // CORREZIONE 1: fetch usa i : per assegnare i valori nell'oggetto
                const risposta = await fetch("/api/analytics/reset", { method: "GET" });

                if (risposta.ok) {
                    document.getElementById('val-entrate').innerText = "€ 0.00";
                    document.getElementById('val-uscite').innerText = '€ 0.00';
                    document.getElementById('val-saldo').innerText = '€ 0.00';
                    alert("Dati resettati correttamente!");
                }
                else {
                    alert("Errore durante il reset del database.");
                }

            } catch (error) {
                console.error("Errore durante il reset del riepilogo", error);
                alert("Si è verificato un problema di connessione.");
            }
        }


        // --- 1. LETTURA DEI DATI ---
        async function caricaRiepilogo() {
            try {
                const risposta = await fetch("/api/analytics/riepilogo");
                const dati = await risposta.json();

                document.getElementById('val-entrate').innerText = "€ " + dati.totale_entrate.toFixed(2);
                document.getElementById('val-uscite').innerText = '€ ' + dati.totale_uscite.toFixed(2);
                document.getElementById('val-saldo').innerText = '€ ' + dati.saldo_netto.toFixed(2);

            } catch (error) {
                console.error("Errore durante il caricamento del riepilogo", error);
            }
        }

        // --- 2. INVIO DEL FILE EXCEL ---
        async function importaExcel() {
            const fileInput = document.getElementById("file-excel");
            const file = fileInput.files[0];

            if (!file) {
                alert("Seleziona un file Excel prima di cliccare Importa.");
                return;
            }

            const formData = new FormData();
            formData.append("file_xlsx", file);

            const bottone = document.getElementById("btn-importa");
            bottone.innerText = "Importazione in corso...";
            bottone.disabled = true;

            try {
                const risposta = await fetch("/api/transizioni/import", {
                    method: "POST", body: formData
                });

                if (risposta.ok) {
                    alert("Dati elaborati e classificati con successo!");
                    caricaRiepilogo();
                }
                else {
                    alert("Errore durante l'importazione dal server.");
                }

            } catch (error) {
                // CORREZIONE 2: Usa 'error', non 'errore'
                console.error("Errore di rete:", error);
                alert("Si è verificato un problema di connessione.");
            }
            finally {
                bottone.innerText = "Importa Excel";
                bottone.disabled = false;
                fileInput.value = "";
            }
        }

        // Eseguiamo la funzione non appena la pagina viene aperta
        caricaRiepilogo();
    </script>
</body>

</html>
